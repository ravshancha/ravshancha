name: Deploy website to cPanel

on:
  push:
    branches: [development]
    paths:
      - "site/**"
      - ".github/workflows/deploy-cpanel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.CPANEL_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The CV site's order form needs api/lead-config.php next to api/lead.php. That file holds secrets,
      # so it is not in the repository: it is written here from the repository secrets and variables and
      # uploaded with the rest of site/. Without it the endpoint answers 503 and the form falls back to Telegram.
      - name: Write the lead endpoint configuration
        env:
          LEAD_SHEETS_URL: ${{ secrets.LEAD_SHEETS_URL }}
          LEAD_SHEETS_SECRET: ${{ secrets.LEAD_SHEETS_SECRET }}
          LEAD_NOTIFY_EMAIL: ${{ vars.LEAD_NOTIFY_EMAIL || 'ismoilov.ravshanjon@gmail.com' }}
          LEAD_MAIL_FROM: ${{ vars.LEAD_MAIL_FROM || 'noreply@ravshancha.uz' }}
          LEAD_SMTP_PASSWORD: ${{ secrets.LEAD_SMTP_PASSWORD }}
          LEAD_SMTP_HOST: ${{ vars.LEAD_SMTP_HOST || 'mail.ravshancha.uz' }}
          LEAD_SMTP_PORT: ${{ vars.LEAD_SMTP_PORT || '465' }}
          LEAD_SMTP_USER: ${{ vars.LEAD_SMTP_USER || 'noreply@ravshancha.uz' }}
          LEAD_SMTP_VERIFY: ${{ vars.LEAD_SMTP_VERIFY || '1' }}
        run: |
          python3 - <<'PY'
          import os

          def php_string(value):
              return "'" + value.strip().replace("\\", "\\\\").replace("'", "\\'") + "'"

          def php_port(value):
              try:
                  port = int(value)
              except (TypeError, ValueError):
                  port = 0
              return str(port if 1 <= port <= 65535 else 465)

          # The mailbox is only used when its password is set; without one the endpoint keeps to the host's mail().
          password = os.environ.get('LEAD_SMTP_PASSWORD', '').strip()
          values = {
              'sheets_url': php_string(os.environ.get('LEAD_SHEETS_URL', '')),
              'sheets_secret': php_string(os.environ.get('LEAD_SHEETS_SECRET', '')),
              'notify_email': php_string(os.environ.get('LEAD_NOTIFY_EMAIL', '')),
              'mail_from': php_string(os.environ.get('LEAD_MAIL_FROM', '')),
              'smtp_host': php_string(os.environ.get('LEAD_SMTP_HOST', '') if password else ''),
              'smtp_port': php_port(os.environ.get('LEAD_SMTP_PORT', '')),
              'smtp_user': php_string(os.environ.get('LEAD_SMTP_USER', '') if password else ''),
              'smtp_pass': php_string(password),
              'smtp_verify': 'false' if os.environ.get('LEAD_SMTP_VERIFY', '1').strip() in ('0', 'false', 'no') else 'true',
          }
          lines = ['<?php', '// Written by the deploy workflow on every deployment: edits made on the server are overwritten.',
                   '// The values come from the repository secrets and variables, see DEPLOYMENT.md.', 'return [']
          lines += ["    '%s' => %s," % (key, value) for key, value in values.items()]
          lines += ['];', '']
          open('site/api/lead-config.php', 'w', encoding='utf-8').write('\n'.join(lines))
          PY
          test -s site/api/lead-config.php
          if command -v php >/dev/null; then php -l site/api/lead-config.php; fi

      - name: Deploy static site over FTPS
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ${{ vars.CPANEL_FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.CPANEL_FTP_PORT || '21' }}
          local-dir: ./site/
          server-dir: ${{ vars.CPANEL_FTP_SERVER_DIR || './' }}
          log-level: minimal
