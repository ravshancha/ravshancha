name: Deploy website to cPanel

on:
  push:
    branches: [development]
    paths:
      - "site/**"
      - ".github/workflows/deploy-cpanel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.CPANEL_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Deploy static site over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ${{ vars.CPANEL_FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.CPANEL_FTP_PORT || '21' }}
          local-dir: ./site/
          server-dir: ${{ vars.CPANEL_FTP_SERVER_DIR || './' }}
          log-level: minimal
